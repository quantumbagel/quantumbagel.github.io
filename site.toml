category = "solo"
title = "NCSU Parking"
date = "2026"
description = "A campus parking forecaster for NC State decks that pairs live occupancy polling and Localist event schedules with a baseline gate so XGBoost only ships for a lot when it beats an hour-of-week median."
details = "A personal forecasting stack built to answer one question: if I head to this NC State deck at this time, how full will it be? A background collector polls NC State's public parking API (storing delta-only snapshots in UTC and clamping negative visitor free_spaces to 100% full) plus campus Localist events into PostgreSQL. Features build a 5-minute Eastern-time grid with lags, rolling stats, haversine distances to nearby events, and hardcoded NCSU academic calendar dates. An hour-of-week median baseline is always fit first, and per-lot XGBoost models across eight horizons (15 minutes to 24 hours) are only kept when they beat that baseline on validation MAE. Training runs as a separate file-queued job inside the collector container (capped at 4 GB RAM) so the Streamlit dashboard never loads XGBoost. Private repo."
skills = ["Python", "PostgreSQL", "XGBoost", "pandas", "Streamlit", "Docker"]
page = true
tone = "80"
hero = "media/projects/ncsuparking/pipeline.svg"
hero_caption = "Occupancy API and campus events into Postgres, benchmarked against an hour-of-week median before Streamlit ever sees a forecast."

[[projects.essay]]
heading = "Predicting campus deck occupancy"
body = """NC State publishes live spot counts for its campus parking decks, which tells you whether a deck is full right now, about twenty minutes too late if you are already driving there. I wanted something that answers a simpler question: if I head to this deck at 10:30 AM tomorrow, will there be spots open?
<p>I built this as a private Dockerized stack backed by PostgreSQL and a Streamlit dashboard with views for finding the emptiest lot at a target time, plotting 24-hour curves against a typical day, and browsing historical patterns. The collector saves delta-only snapshots from the public API (clamping quirky visitor-deck feeds that occasionally report negative <code>free_spaces</code> to 100% full) and generates forecasts across eight horizons from 15 minutes out to 24 hours.</p>"""

[[projects.essay]]
heading = "Benchmarking against a seasonal baseline"
body = """Campus parking is heavily cyclical. A Tuesday at 10:00 AM looks almost identical to last Tuesday at 10:00 AM, so a plain hour-of-week median is already surprisingly accurate and works starting from day one while data is still accumulating. Plenty of ML demos skip that check and celebrate a gradient-boosted tree for rediscovering class schedules.
<p>My training job always fits the seasonal median first and only keeps a per-lot XGBoost model if it gets lower validation MAE across the forecasting horizons. If a deck follows strict routines and XGBoost overfits it, the model gets discarded and that lot stays on the median. Training runs on an hourly check (or on demand via a file queue from the dashboard) inside the collector process with a 4 GB memory limit, writing pickled artifacts to a shared Docker volume so the Streamlit app stays fast and never imports XGBoost at runtime.</p>"""
figure = "media/projects/ncsuparking/pipeline.svg"
caption = "The gate in the middle discards any per-lot XGBoost model that fails to beat the hour-of-week median."

[[projects.essay]]
heading = "Adding campus events"
body = """Where a seasonal median misses badly is game days, concerts, and big campus events. A second collector scrapes NC State's Localist event feed, geocodes each venue, and computes haversine distances from each event to each parking deck alongside academic-calendar flags (breaks, exams, reading days). Those features give the per-lot models advance notice when a weekend afternoon is going to behave differently than a typical weekend."""

