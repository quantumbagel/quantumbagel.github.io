[[projects.essay]]
heading = "Building a host instead of another game bot"
body = """My earlier Discord game bots—Piranha and the original PlayCord—kept running into the same wall: game rules, Discord embeds, and in-memory state dicts were all tangled together. If the bot restarted, every active game evaporated. If I wanted to add a new game, I ended up re-implementing lobbies, turn timers, and forfeits all over again. Strife is a ground-up rewrite built as a proper game host rather than a pile of cogs.
<p>Players create lobbies with <code>/play</code> (public or private, with pre-approvals, blacklists, and optional bot opponents), and once everyone readies up, the match opens in its own thread so it doesn't trash the main channel. Seven games ship in the box—Tic-Tac-Toe, Connect Four, Chess (including Chess960), Coup, Mafia, Spyfall, and Liar's Dice—and extra games load from a <code>plugin.toml</code> manifest that declares version constraints, dependencies, and custom application emoji. I'm careful not to call the plugin loader a security sandbox: games run in-process, so the goal is fault isolation (a broken game ruins its own match, not the whole server), and installing external plugins stays owner-only.</p>"""

[[projects.essay]]
heading = "Crash-safe resume and one play() loop"
body = """The whole architecture hinges on keeping games completely ignorant of Discord. A game subclass only sees <code>GameContext</code>—a tiny surface for rendering a layout, waiting for moves, sending private DMs, and pulling from a seeded <code>self.rng</code>. Because the game never touches <code>discord.py</code>, the exact same <code>play()</code> method runs live in a thread (<code>LiveContext</code>), steps through finished games via <code>/strife replay</code> using a 6-character match code (<code>ReplayContext</code>), and plays locally in a terminal or test harness (<code>MockContext</code>).
<p>PostgreSQL 16 stores guilds, player stats, and an append-only move log for every match. If the bot crashes or restarts while games are running, it scans for live matches on boot, re-initializes each game with its original RNG seed, and replays the move log back to the current turn before re-enabling buttons. If a plugin was upgraded and its build version changed underneath a live game, the host cleanly abandons the match instead of corrupting the board.</p>"""
figure = "media/projects/strife/architecture.svg"
caption = "Discord handles I/O, Postgres owns the move log, and plugins never see anything past GameContext."

[[projects.essay]]
heading = "The unglamorous 90%"
body = """Writing Coup or Connect Four was the fun part; the bulk of the codebase is all the host machinery that keeps Discord from falling over. Button clicks carry signed <code>msgpack</code> payloads in their <code>custom_id</code> so the router knows which match and prompt a click belongs to without hoarding huge view trees in RAM. Turn deadlines, lobby timeouts, and a <code>play_hang_seconds</code> watchdog keep a stalled game or a loop of invalid bot moves from blocking the event loop. Even the tests boot the real <code>StrifeBot</code> against Postgres and a fake Discord transport. The bot isn't publicly hosted yet while I keep polishing it, so Docker Compose is the way to run it for now."""

