[[projects.essay]]
heading = "The platform"
body = """AERPAW — Aerial Experimentation and Research Platform for Advanced Wireless — is NC State's NSF PAWR testbed. The public line is that it is the first platform built to study 5G/6G together with autonomous aircraft. The vehicles experimenters actually fly are the LAM6 and SAM4 multicopters and a rover, all on Cube Orange running ArduPilot, speaking MAVLink v2. Portable radio nodes (SDRs on the large vehicles, lighter radios on SAM4) are the payload. Experiment VMs start through <code>startexperiment.sh</code> → <code>startVehicle.sh</code>.
<p>A MAVLink filter sits between experimenter code and the autopilot. Only takeoff, land, simple goto, and yaw go through. Takeoff is 20–100 m. Landing has to be within 5 m of the takeoff point. Gotos are checked against the field geofence; the rover also has no-go zones for creeks. Status messages flow the other way unrestricted. That filter is the real API.</p>"""

[[projects.essay]]
heading = "What I maintain"
body = """The original aerpawlib was John Kesler's DroneKit / pymavlink library: experimenters wrote Runner and StateMachine scripts, asyncio in the background, QGroundControl <code>.plan</code> files for waypoints. I am a listed co-author and the primary maintainer of the official <a href="https://github.com/AERPAW/aerpawlib">AERPAW/aerpawlib</a> tree. Current release is 1.4.11.
<p>I migrated the library onto MAVSDK so vehicle firmware can move without monkey-patching Python. v1 keeps the old surface — DroneKit-shaped telemetry wrappers, a dual asyncio/gRPC loop so existing sync-looking scripts still run. v2 is the API I wanted: <code>VehicleTask</code>, <code>can_takeoff</code> / <code>can_goto</code> / <code>can_land</code>, one event loop. I also own the SITL harness, the CLI, the docs, and the 1.4.x series that made this survive the live E-VM / C-VM filter.</p>"""

[[projects.essay]]
heading = "What the filter taught the API"
body = """<code>SET_MODE</code> is not on the allow-list. <code>MAV_CMD_DO_SET_MODE</code> is. <code>action.hold()</code> / LOITER severs the E-VM link, so GUIDED has to be held with raw MAVLink. The safety checker has to talk to this node's C-VM, not localhost and not the OEO console — that bug shipped and got reverted in 1.4.7–1.4.8. Auto RTL runs only after a successful mission; abort used to fly home at <code>home.alt ≈ 0</code> and get rejected by the 20 m minimum.
<p>Smaller, uglier ones: timed <code>set_velocity</code> loops cancelled the next command; geodesic bearings ignored latitude (about 51° vs 45° at Lake Wheeler); <code>ExternalProcess</code> dropped stdin/stdout files. Multi-vehicle ZMQ started as fire-and-forget PUB/SUB. It drops transitions. The control plane is now JSON with ACK, HELLO, and <code>wait_for_peers</code> on ports 5570/5571.</p>"""
figure = "media/projects/aerpawlib/filter.svg"
caption = "The allow-list is the API. Status comes back unrestricted; SET_MODE and LOITER do not go through."

[[projects.essay]]
heading = "How I know it works"
body = """Unit tests run on Python 3.10–3.14 in CI. Integration tests start ArduCopter and Rover SITL plus mavsdk_server and reset the vehicles between cases. MAVProxy will block if stdout is a pipe — the suite has to run with capture off. Docs live at aerpaw.github.io/aerpawlib. The useful lesson is boring: SITL is necessary and not sufficient. The filter wins arguments."""

