hero_caption = "Media Session and first-party metadata in the tab, native messaging into the Rust helper, and rate-limited IPC out to Discord."
preview = "media/projects/amazon/popup.png"
preview_caption = "The extension popup during playback—live Discord preview, snooze and hide toggles, and helper connection status."

[[projects.essay]]
heading = "Reading playback without touching the DOM"
body = """Discord has native Spotify integration, while Amazon Music users are stuck with third-party extensions that scrape CSS classes out of the web player and break every time Amazon ships a frontend tweak. I built this extension (currently v1.8.1) to avoid scraping the DOM altogether.
<p>The primary source is the browser's built-in Media Session API—the same interface that powers keyboard media keys and lock-screen controls—which gives me the title, artist, artwork, position, and play/pause state through a browser standard that survives site redesigns. For everything Media Session leaves out (links, whether you're listening to an album, playlist, or station, artist art, release year, and HD/Ultra HD stream quality), a single page hook queries Amazon's own player API from your signed-in browser session. Everything stays isolated in one file, so even if Amazon ever changes an endpoint, there's only one place to patch.</p>"""

[[projects.essay]]
heading = "A small Rust helper instead of an Electron app"
body = """Browser extensions aren't allowed to open local Unix sockets or Windows named pipes directly, so they can't talk to Discord's local IPC on their own. Rather than shipping a bloated desktop app that has to sit in the system tray, I wrote a tiny native-messaging host in Rust. You download the binary and open it once; it copies itself into your user directory and registers its manifest for every Chromium and Firefox browser it finds on macOS, Windows, or Linux. After that, the browser launches and stops it automatically in the background.
<p>Discord caps Rich Presence at five updates every twenty seconds, so the Rust helper coalesces incoming state changes, holds extra ticks back until the window opens, and quietly reconnects whenever Discord closes and reopens. On top of that, the extension popup gives you custom status text templates with a live preview, separate settings for podcasts, quick snooze timers, and a 'Never show' list for specific tracks, artists, or playlists.</p>"""
figure = "media/projects/amazon/rpc.svg"
caption = "Tab hook to extension to Rust native-messaging host to Discord IPC, with coalescing at the host boundary."

