[[projects.essay]]
heading = "The testbed"
body = """AERPAW (Aerial Experimentation and Research Platform for Advanced Wireless) is NC State's NSF testbed for running 5G and 6G wireless experiments on autonomous vehicles. Visiting researchers write Python scripts to fly custom multicopters like the LAM6 and SAM4, or drive ground rovers, all using Cube Orange flight controllers running ArduPilot with MAVLink v2. The vehicles carry software-defined radios and custom RF payloads out at Lake Wheeler, so bad commands cannot be allowed to reach the autopilot.
<p>A MAVLink safety filter sits between every experimenter script and the flight controller. Telemetry comes back unrestricted, so scripts can read whatever vehicle state they need, while outbound commands have to pass a strict allow-list: takeoff between 20 and 100 meters, landing within 5 meters of the takeoff point, yaw, and waypoints inside the field geofence (plus creek no-go polygons for the rover). Anything else gets dropped or rejected, so the filter ends up defining what the library can do.</p>"""

[[projects.essay]]
heading = "Moving off DroneKit"
body = """John Kesler wrote the original aerpawlib on top of DroneKit and pymavlink, giving experimenters <code>Runner</code> and <code>StateMachine</code> base classes along with QGroundControl <code>.plan</code> file support. Once DroneKit stopped being maintained, newer Python and ArduPilot versions began breaking under it. I took over as primary maintainer of <a href="https://github.com/AERPAW/aerpawlib">AERPAW/aerpawlib</a> to move the backend onto MAVSDK so the testbed could upgrade firmware without monkey-patching Python.
<p>Dozens of sample experiments and researcher scripts already depended on the v1 interface, so breaking compatibility was out of the question. I kept v1 intact with DroneKit-shaped telemetry wrappers and a dual asyncio/gRPC bridge so existing scripts keep running untouched, and built a v2 API beside it. v2 runs on a single Python <code>asyncio</code> event loop with explicit preflight checks (<code>can_takeoff</code>, <code>can_goto</code>, <code>can_land</code>) and cancellable <code>VehicleTask</code> handles.</p>"""

[[projects.essay]]
heading = "Living with the safety filter"
body = """Most of the bugs I fixed in the 1.4.x releases came from how MAVSDK interacts with AERPAW's filter. Standard <code>SET_MODE</code> packets are blocked, and calling <code>action.hold()</code> puts the vehicle into LOITER, which severs the Experiment VM's control link. To stay in GUIDED mode without losing the link, the library sends raw <code>MAV_CMD_DO_SET_MODE</code> commands directly. Auto-RTL had a similar trap: aborting a mission used to try flying home at <code>home.alt ≈ 0</code>, which hit the 20-meter altitude floor and got rejected immediately.
<p>Supporting active flights turned up smaller bugs too. Expiring <code>set_velocity</code> timers were cancelling newer velocity commands, <code>Coordinate.bearing</code> ignored cosine latitude scaling (about 6 degrees off at Lake Wheeler), and <code>ExternalProcess</code> dropped redirected stdin and stdout files. Multi-vehicle coordination had its own issues: ZeroMQ PUB/SUB dropped state transitions whenever nodes came up out of sync, so the control plane on ports 5570 and 5571 now speaks JSON with ACKs, HELLO handshakes, and a <code>wait_for_peers</code> barrier.</p>"""
figure = "media/projects/aerpawlib/filter.svg"
caption = "Telemetry flows back unrestricted, while outbound commands have to clear the allow-list and the Companion VM's KML geofence."

[[projects.essay]]
heading = "Testing before flight day"
body = """Unit tests run in CI on Python 3.10 through 3.14, and the integration suite spins up ArduCopter and ArduRover SITL instances alongside <code>mavsdk_server</code>, resetting the vehicles between cases. One annoying quirk is that MAVProxy blocks if stdout is piped, so the suite has to run with output capture turned off. SITL catches regressions before anyone drives out to the field, though live flights still catch edge cases that a local simulator never triggers."""

