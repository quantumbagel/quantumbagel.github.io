[[projects.essay]]
heading = "Context (and what stays private)"
body = """Over the summer of 2026, I interned with Merrill Lynch Wealth Management working on an internal calculations platform used for portfolios managing over <strong>$500M</strong> in assets. The equity research team was constantly pulling fundamentals and price history from FactSet, applying custom valuation formulas, and formatting clean spreadsheets for review. Because ML-Ticker is proprietary internal software, there's no public repo and I'm not sharing internal tickers, formulas, or entitlements—just the architecture, because the interesting engineering is in how the pipeline is put together.
<p>The tool runs as a packaged Python CLI inside FactSet's Programmatic Environment. Instead of maintaining fragile one-off spreadsheets or notebooks, analysts describe what they want in YAML, run a single command, and get either a quick terminal table or a presentation-ready Excel workbook.</p>"""

[[projects.essay]]
heading = "Validating the config language before touching FactSet"
body = """FactSet FQL queries are powerful, easy to mistype, and slow enough that discovering a typo halfway through a run is miserable. ML-Ticker validates the entire YAML config with strict Pydantic schemas (extra keys forbidden) before any network request goes out. Holdings snapshots and historical time series each get their own config models, and an FDT mode scores a target company against a peer group to produce Bull, Base, and Bear valuation multiples.
<p>Custom formulas go through a restricted Python AST checker that walks the syntax tree against an allowlist of operators and safe builtins, blocking attribute access, imports, and anything outside pure math. From there, the engine builds a dependency graph of every metric, runs a hand-rolled topological sort, prints the exact cycle path if two formulas reference each other, and offers typo suggestions if a name doesn't exist. Only once the entire graph checks out does the query planner batch the FQL calls (including a second pass when a derived metric needs extra lookups).</p>"""
figure = "media/projects/ml-ticker/pipeline.svg"
caption = "Validate first, plan the FactSet batches, derive in topological order, then export."

[[projects.essay]]
heading = "Keeping missing data honest"
body = """The sneakiest bugs in financial tooling are type errors disguised as data. Real market feeds have gaps—a company doesn't report a field, a historical series starts late, or a denominator comes back empty. If your pipeline quietly coerces missing values to zero, you end up with believable-looking multiples that are completely wrong. ML-Ticker carries missing values as explicit typed N/A objects through every formula evaluation so gaps and divide-by-zero cases surface visibly instead of corrupting a sheet.
<p>Finished results go wherever the analyst needs them: colorized Rich tables right in the terminal for quick checks, JSON for downstream scripts, or styled multi-sheet Excel workbooks via <code>openpyxl</code> that tuck raw inputs and intermediate calculations into hidden helper tabs behind the summary view.</p>"""

