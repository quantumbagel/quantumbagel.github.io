date = "2024 - Present"
description = "An ADS-B receiver network for AERPAW that merges multi-station feeds, scores every aircraft for spoofing across 16 physical and protocol checks, evaluates polygon geofences, and feeds a read-only React radar."
built = "PyAerial started as a ground-up replacement for my earlier tracker, <a href='https://github.com/quantumbagel/airstrik.py' class='text-link hover:underline'>airstrik.py</a>, and has since grown into v1.0.0. It pulls Mode S and ADS-B frames from dump1090, readsb, angle-of-arrival arrays, or recorded captures, runs a 16-check spoofing monitor before deduplicating copies, checks Shapely polygon geofences, and splits the tracking engine (<code>pyaerial run</code>) completely from the read-only FastAPI/React portal (<code>pyaerial web</code>)."
challenges = [
