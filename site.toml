title = "PyAerial"
date = "2024 - Present"
description = "An ADS-B receiver network for AERPAW that merges multi-station feeds, scores aircraft for spoofing across 16 physical and protocol checks, evaluates polygon geofences, and serves a read-only React radar."
built = "PyAerial replaced my earlier aircraft tracker, <a href='https://github.com/quantumbagel/airstrik.py' class='text-link hover:underline'>airstrik.py</a>, and is now at v1.0.0. It reads Mode S and ADS-B frames from dump1090, readsb, angle-of-arrival arrays, or recorded captures, runs 16 spoofing checks before deduplicating copies, checks Shapely polygon geofences, and separates the tracking daemon (<code>pyaerial run</code>) from the read-only FastAPI and React portal (<code>pyaerial web</code>)."
challenges = [
    "Compact Position Reporting needs a fixed ground reference separate from any geofence polygon, plus 0.5 degree jump rejection, otherwise a receiver on the wrong side of the field decodes convincing ghost positions.",
    "Spoofing checks (AoA, TDOA multilateration, RSSI vs. range, timing jitter) need every raw copy from every station, so the engine buffers frames in a 100 ms merge window and hands all copies to the integrity monitor before deduplicating.",
    "Curved ETA math blows up when an aircraft's turn circle is huge, so zone entry gates take <code>min(curved, straight)</code> and wrap heading ranges cleanly across 360/0 degrees.",
    "A single noisy sample brushing a boundary should not spam Discord or Slack, so alerts use dwell hysteresis and store open episodes in a Redis outbox so restarts close them cleanly.",
    "To make sure the web portal can never corrupt live state or stall decoding, <code>import-linter</code> checks in CI fail the build if <code>pyaerial.webapp</code> or <code>pyaerial.api</code> ever imports a Redis or SQLite writer.",
]
learned = [
    "ADS-B is a messy RF and wire-format problem long before you ever draw a dot on a map.",
    "Keeping live state in Redis and permanent flight history in SQLite WAL is much simpler and faster than trying to force one database to do both.",
    "In a research archive, you should tag suspicious flights with their integrity score and receiver list rather than quietly dropping them.",
]
