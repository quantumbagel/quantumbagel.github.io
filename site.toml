[[projects.essay]]
heading = "From hardcoded scripts to recipes"
body = """fractalgen started as two scripts I wrote to generate desktop wallpapers for myself. Every fractal formula, color ramp, and crop lived directly in Python, so adding a new image meant duplicating a function and editing constants. I rebuilt it around two pieces: generators (registered functions that turn a region of the plane into field data) and recipes (TOML tables that pick a generator and describe everything else about the picture).
<p>Recipes can extend other recipes, carry separate portrait framing for phones, and stack composited layers and effects, so most new looks take a few lines of TOML. The same recipe drives the CLI (<code>fractalgen render</code>, including <code>--random</code>), multi-device batch presets, and the browser GUI. Version 0.1.0 went up on GitHub in November 2026 under the MIT license.</p>"""

[[projects.essay]]
heading = "Making the math fast enough to explore"
body = """An 8K wallpaper has over 33 million pixels, and several looks iterate each pixel more than a thousand times. The inner loops are compiled with Numba and run in parallel across cores. Escape-time kernels use Brent cycle detection so interior points that settle into repeating orbits stop early instead of hitting the iteration cap. Simulations like Gray-Scott reaction-diffusion and physarum slime mold run on multi-threaded solvers, and batch renders run in isolated worker processes with timeouts so one slow look cannot stall a preset.
<p>Interactive editing has its own speed constraint, since nobody wants to wait five seconds just to preview another palette. The server stores expensive intermediate buffers (iteration counts, density grids) in a bounded LRU cache and applies palettes, tone curves, and post-processing afterward, so recoloring or adjusting bloom updates quickly.</p>"""

[[projects.essay]]
heading = "Same picture at 960 px and 16K"
body = """A look framed in a 960 pixel preview window should match the 16K export. Views are defined against a 4K reference canvas with explicit fill, cover, and contain rules for other aspect ratios, and pixel-radius effects like blur and bloom scale proportionally with the output dimensions.
<p>Exposure needed the same fix. Generators that stretch dynamic range to fit the current frame's histogram re-exposed the image every time I panned, dimming bright filaments whenever something brighter scrolled into the corner. fractalgen now measures those tone statistics once on the recipe's authored view and replays them while panning and zooming, keeping colors anchored to the math rather than the current viewport.</p>"""

[[projects.essay]]
heading = "The browser editor"
body = """Running <code>fractalgen gui</code> starts a local server and opens an editor written with Preact and <code>htm</code> as plain ES modules, with no Node build step or bundler. You can browse all 129 looks, generate parameter variations, drag and scroll to pan, zoom, and rotate, tweak palettes, layers, and effects with full undo history, and hold backslash to compare against the original preset.
<p>Exports support 2x and 3x supersampling, and every PNG or JPEG stores its full recipe in the file metadata. You can take any finished wallpaper and fork it straight back into an editable TOML file.</p>"""

