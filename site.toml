[[projects]]
category = "solo"
title = "Statify"
date = "2023 - 2026"
description = "A Java 21 Spigot and Paper plugin for server-wide Minecraft stat leaderboards, powered by a hand-written expression language with saved custom queries."
details = "Started as my first Java plugin back in 2023 and later rewritten for Spigot and Paper 1.21 on Java 21. It reads the stats/<uuid>.json files Minecraft already writes, so it works on existing worlds with no setup, and evaluates arithmetic queries like mined:diamond_ore / (custom:play_time / 72000) through a hand-written lexer, recursive-descent parser using sealed-interface records, and pattern-matching evaluator. Players can save reusable queries (owner:name) with inline expansion and cycle detection, parse errors underline the exact failing character, ties use standard competition ranking (1, 2, =2, 4), and the core is JUnit-tested with no Bukkit dependency."
link = "https://github.com/quantumbagel/Statify"
skills = ["Java 21", "Spigot / Paper API", "JUnit"]

