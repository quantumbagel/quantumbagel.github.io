<p>Permissions are scoped per server. Docker Compose + pytest. The hosted instance is personal, not a product.</p>"""

[[projects.essay]]
heading = "Registry, then persistence"
body = """The useful design choice was making the registry the source of what can exist, and Mongo the source of what this guild actually configured. Autocomplete stays honest. A missing trigger type fails closed instead of executing a half-built rule.
<p>I would not sell this as a platform. I would show it as the moment I stopped writing one-off cogs for every “if X then Y” request.</p>"""
