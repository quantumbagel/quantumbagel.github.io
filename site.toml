[[projects.essay]]
heading = "Why build an emulator in Scratch?"
body = """Scratch is meant for teaching kids to code: you get variables, lists, and custom blocks, no bitwise math, no return values from functions, and a 30 fps cap. I wanted to see if a real 8-bit game console could run inside it anyway. The ColecoVision is a sweet spot for that kind of stunt—a real Z80 CPU, the well-documented TMS9918A video chip, and a straightforward SN76489 sound generator.
<p>Dragging thousands of blocks by hand would have driven me insane, so I wrote the project in goboscript (which compiles text source into a standard <code>.sb3</code> file) and generated the repetitive CPU logic with Python. Version 1.0 went up on Scratch in November 2026, followed by v1.1 with a pixel-perfect 1:1 mode that runs a lot smoother in stock Scratch. In TurboWarp—which compiles Scratch projects to JavaScript—it runs cartridges at a full 60 fps.</p>"""

[[projects.essay]]
heading = "Compiling a Z80 down to 2,900 blocks"
body = """A Python script emits the Z80 core directly into goboscript. Registers live in sprite variables, the 64K address space is a Scratch list, and opcode dispatch walks an 8-level binary tree of comparisons. Since Scratch doesn't have bitwise AND, OR, or XOR, the core populates a 64K AND table on startup, derives OR and XOR arithmetically, and reads flag bits out of precomputed ADD, SUB, and CP tables.
<p>The first working core weighed in around 17,000 blocks. Merging opcodes that only differ by register or condition code into shared handlers, reusing one instruction set for both IX and IY, and pulling common helpers into custom blocks shrank it down to 2,900 blocks. Every single one of the 1,604 documented and undocumented opcodes is checked against 39,715 SingleStepTests CPU vectors—verifying registers, flags, memory writes, and cycle counts on both stock Scratch and TurboWarp.</p>"""

[[projects.essay]]
heading = "Pen graphics, clone sound, and the 5 MB ceiling"
body = """Scratch doesn't give you a pixel buffer, so the entire screen is painted with pen strokes. The renderer tracks which 8-pixel cells changed on each scanline, collapses adjacent pixels of the same color into a single line, and refuses to paint over an already-drawn pixel because WebGL's anti-aliased pen edges let the old color bleed through. Sound spawns one clone per SN76489 channel, looping a short waveform and modulating Scratch's pitch and volume effects.
<p>Scratch also caps project files near 5 MB, which gets tight fast once you have a BIOS, lookup tables, and a library of cartridges (my full build packs 153 games; a fresh open-source checkout bundles six free CVBasic demos plus the 240p Test Suite). Running the emulated hardware inside a sprite clone keeps roughly 2 MB of live RAM, VRAM, and tables out of the saved <code>.sb3</code> because Scratch never serializes clones. Cartridges and save states use an LZ4-style compressor written in both Python and Scratch, encoded in a 64-character alphabet that avoids lowercase letters because Scratch's list lookups ignore case.</p>"""
figure = "media/projects/coleco/test-suite.png"
caption = "Artemio Urbina's 240p Test Suite (ported to the ColecoVision by Oscar Toledo G.), which boots by default as a quick check of video, sound, and controls."

[[projects.essay]]
heading = "Testing a Scratch project like real software"
body = """Instead of clicking around in a browser hoping nothing broke, the test suite drives the compiled project headlessly inside TurboWarp's VM. A mock renderer rasterizes the pen commands and compares the result pixel-for-pixel against an independent TMS9918A reference implementation—including verifying that incremental redraws match a full-frame draw. Other tests navigate the in-emulator menu with simulated keys and clicks (including the ranked fuzzy search where <code>dk</code> matches Donkey Kong and <code>mdc</code> matches Mr. Do's Castle), check every sound channel through a model of Scratch's audio engine, and round-trip save/reload the project to verify no bloated working lists leak into the file.
<p>A final library test boots every cartridge past its title screen and stitches the captures into a contact sheet. It won't prove a game is beatable to the credits, but if a video-mode tweak breaks half the library, you see it immediately.</p>"""
figure = "media/projects/coleco/library.png"
caption = "Contact sheet from the library check—booting every cartridge in the emulator and capturing its opening screen."

