[[projects.essay]]
heading = "Automating camera tracking for drone flights"
body = """During field experiments at AERPAW, researchers frequently fly autonomous drone missions that need high-definition video documentation. Manually operating a camera to follow a fast-moving drone across wide open fields is difficult and unreliable, especially during complex multi-vehicle flights. I developed DroneTracker to automate this process by reading live GPS coordinates from the testbed telemetry stream and continuously aiming an AXIS Q-8615E pan-tilt-zoom camera directly at the aircraft while managing video recording sessions.
<p>The service is published in the <a href="https://github.com/quantumbagel/DroneTracker">quantumbagel/DroneTracker</a> repository and runs as a Docker container deployed at the camera tower site. It listens to Kafka messaging topics for telemetry updates and operator instructions, then communicates with the camera over local network interfaces using the manufacturer's VAPIX API.</p>"""

[[projects.essay]]
heading = "Calculating camera angles from geodetic coordinates"
body = """The core tracking logic converts latitude, longitude, and altitude measurements from the drone into local camera viewing angles. Pan is calculated as a spherical bearing from the camera's surveyed installation point to the aircraft, tilt is derived from relative elevation and slant range, and zoom is computed using a calibrated field-of-view model that adjusts optical magnification based on drone size and distance. These configuration parameters are stored in a site configuration file so the camera can be redeployed to different towers without code changes.
<p>To keep the camera pointed smoothly at moving targets, the service can apply an optional predictive lead time based on reported velocity vectors. Getting this right required converting velocity components into consistent North-East-Up reference frames, accounting for camera mounting compass offsets, and enforcing minimum angular movement thresholds to keep the motor assembly from oscillating unnecessarily on tiny coordinate fluctuations.</p>"""
figure = "media/projects/dronetracker/aim.svg"
caption = "Coordinate transformation geometry mapping aircraft geodetic coordinates into local pan, tilt, and optical zoom steps."

[[projects.essay]]
heading = "Field operations and camera control"
body = """Running tracking software in the field comes with practical network and hardware constraints that do not show up in clean simulated environments. For example, if network lag delays telemetry packets, issuing commands based on old data causes the camera to swing toward where the drone was seconds ago rather than where it is now. To prevent this, the tracker discards outdated packets and parks the camera safely whenever the telemetry stream times out.
<p>Managing video recording also required custom work on the camera interface. The existing open source Python library for AXIS cameras supported basic movement but lacked methods for starting or exporting recordings, so I forked the project to add recording controls and file retrieval over Digest-authenticated HTTP endpoints. The service also includes a dry-run mode that logs computed angles without connecting to a physical camera, making it easy to test logic updates from a laptop before deploying to the field.</p>"""
figure = "media/projects/dronetracker/geometry.svg"
caption = "Overview of the telemetry pipeline from Kafka message ingestion to VAPIX camera control and video export."

