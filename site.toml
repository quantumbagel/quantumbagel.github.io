[[projects.essay]]
heading = "From single-purpose bots to a game platform"
body = """My earlier Discord gaming bots like Piranha and PlayCord were fun experiments, but each bot was tightly coupled to a single game and handled user interaction through hardcoded commands and temporary memory dictionaries. Whenever the bot restarted or encountered an unexpected network disconnect, ongoing games vanished and player progress was lost. Strife was designed from scratch to solve these limitations by providing a durable hosting environment that can run many different games through a unified plugin interface.
<p>The system creates dedicated Discord message threads for every new match, keeping game discussions and interactive button controls neatly contained without cluttering server channels. It includes built-in implementations of seven games, ranging from classic board games like Chess and Connect Four to social deduction games like Coup and Mafia, while allowing new games to be added as modular plugins.</p>"""

[[projects.essay]]
heading = "Persistent state and crash recovery"
body = """The primary design goal for Strife was ensuring that a server restart or network glitch would never ruin an active match. To achieve this, the host records every game move into a PostgreSQL database as an append-only log of player actions and state transitions. If the bot restarts while games are in progress, it scans the database for active matches and replays each recorded move sequentially through the game engine, restoring the exact state of the board before re-enabling player controls.
<p>Because the core game loop is completely separated from Discord's network APIs, the same game logic function can run in multiple contexts. During a live match it listens to Discord button clicks, in replay mode it reads past database records to generate an interactive playback, and in local development it runs directly in a terminal console, which makes testing new game rules much faster.</p>"""
figure = "media/projects/strife/architecture.svg"
caption = "Data flow showing how user inputs pass through Discord interaction handlers, persist in PostgreSQL, and execute across modular game plugins."

[[projects.essay]]
heading = "Managing asynchronous execution and user interface state"
body = """Running interactive games on Discord introduces numerous edge cases around timeouts, concurrent button presses, and user navigation. Strife packs interaction metadata into signed payloads attached to Discord interface components, allowing the bot to route button clicks directly to the appropriate match without keeping large state trees in transient memory.
<p>To keep slow game logic or unexpected loops from freezing Discord's asynchronous event loop, player moves are executed in a managed thread pool with strict timeout bounds. If a game plugin hangs or takes too long to respond, the host can safely terminate the turn and notify the players without impacting any other matches running on the server.</p>"""

