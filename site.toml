[[projects.essay]]
heading = "Watching the rest of the sky"
body = """AERPAW's own drones speak MAVLink through the testbed filter, so we always know where they are. All other traffic near the field (commercial jets, general aviation, medical helicopters) broadcasts on 1090 MHz over Mode S and ADS-B. I wrote PyAerial so operators can watch nearby manned aircraft on a live radar and get alerted if anything heads toward the site, while saving the raw RF data into a labelled research archive.
<p>It replaced an older prototype I wrote called <a href="https://github.com/quantumbagel/airstrik.py">airstrik.py</a> that used circular distance checks, MongoDB, and Kafka. Running all of that for a field tracker was way heavier than it needed to be. PyAerial uses a simpler split: Redis for live aircraft state, SQLite in WAL mode for completed flight history, and webhooks for Discord, Slack, or custom endpoints.</p>"""

[[projects.essay]]
heading = "Two processes, enforced by CI"
body = """The tracking daemon (<code>pyaerial run</code>) is the only process allowed to write to Redis or SQLite. On startup it claims a heartbeat lease so a second engine will refuse to start on top of an active one. Each receiver runs in its own background thread and pushes frames into an intake queue. On each tick, the main loop holds frames for a 100 ms merge window, hands every raw copy to the integrity monitor, deduplicates clean frames, updates tracks, and checkpoints active flights into SQLite every few seconds. Each stage runs inside a <code>StageGuard</code> wrapper so an unexpected exception logs once and bumps a counter without stopping the tick loop.
<p>The dashboard (<code>pyaerial web</code>) runs as a separate FastAPI and React process that reads snapshots from Redis and opens SQLite read-only. Heavy browser traffic or dropped WebSocket clients never stall radio decoding. CI enforces that boundary automatically with <code>import-linter</code> contracts that reject any import path from the web app or API to a store writer.</p>"""
figure = "media/projects/pyaerial/pipeline.svg"
caption = "Separation between the tracking engine that owns writes and the read-only web portal."

[[projects.essay]]
heading = "Spoofing checks, CPR math, and geofences"
body = """ADS-B has no cryptographic authentication, so anyone with an SDR can transmit fake aircraft. PyAerial cross-checks what a plane claims against what the receivers physically measured, combining up to 16 checks depending on the connected hardware: angle of arrival, TDOA multilateration, RSSI versus range curves, line-of-sight radio horizons, Mode S reply cross-checks, timing jitter, kinematics, and frame replay detection. Every aircraft gets a rolling 0-to-1 spoofing score, and suspicious flights stay tagged in the archive so researchers can filter them later.
<p>Normal packets have plenty of quirks too. Compact Position Reporting splits latitude and longitude across alternating even and odd frames and needs a local reference point to decode unambiguously. Using a geofence polygon as that reference causes distant receivers to produce plausible ghost locations. PyAerial anchors decoding to a fixed station coordinate, rejects 0.5 degree jumps, wraps compass sectors across north (350 to 10 degrees is a 20 degree wedge, not 340), and checks Shapely polygons from KML, KMZ, or GeoJSON using explicit altitude, speed, and ETA rules. Because curved-path ETA can blow up when a turn radius gets huge, the gate takes <code>min(curved, straight)</code> and applies dwell hysteresis so brief boundary grazes do not trigger alert spam.</p>"""
figure = "media/projects/pyaerial/geofence.svg"
caption = "Decode with a fixed reference, compute kinematics and ETA, then apply dwell hysteresis before alerting."

[[projects.essay]]
heading = "Crash recovery and deployment"
body = """Field machines lose power and get restarted at bad times. If <code>pyaerial run</code> dies while an alert is open, the next startup replays uncommitted episodes from a Redis outbox and closes any hanging alerts with an <code>ended_by: restart</code> event so every activation gets a matching deactivation. If SQLite is temporarily locked or unreachable, completed flights wait in a bounded in-memory retry buffer until the database is writable again.
<p>Everything ships with Docker Compose, so it can talk to an existing dump1090 server on the host, launch a bundled RTL-SDR container with <code>--profile sdr</code>, or replay a sample capture on a laptop with no radio hardware plugged in.</p>"""

