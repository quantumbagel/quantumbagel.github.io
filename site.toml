[[projects.essay]]
heading = "Watching the rest of the sky"
body = """AERPAW's own drones talk MAVLink through the testbed filter, so we always know where they are. Everything else in the sky—commercial airliners, private Cessnas, medical helicopters—shows up on 1090 MHz as Mode S and ADS-B broadcasts. I built PyAerial so operators at the test site can see approaching manned traffic on a live radar and get alerted before anything enters the area, while also building a labelled research archive of real RF data.
<p>It replaced an older prototype I wrote called <a href="https://github.com/quantumbagel/airstrik.py">airstrik.py</a>, which used circular distance filters, MongoDB, and Kafka. Carrying all of that machinery for a field tracker turned out to be way more headache than it was worth. PyAerial starts over with a much cleaner split: Redis for live aircraft state, SQLite in WAL mode for long-term flight history, and webhooks for Discord, Slack, or custom endpoints.</p>"""

[[projects.essay]]
heading = "Two processes, enforced by CI"
body = """The tracking daemon (<code>pyaerial run</code>) is the only process allowed to write to Redis or SQLite. On startup it grabs a heartbeat lease so two engines can't accidentally clobber the same live keys. Each receiver runs on its own background thread and pushes frames into an intake queue; the main tick loop holds frames for a 100 ms merge window, hands every raw copy to the integrity monitor, deduplicates clean frames, updates aircraft tracks, and checkpoints active flights into SQLite every few seconds. Each stage sits inside a <code>StageGuard</code> wrapper so a weird packet in one stage logs an error and bumps a metric instead of killing the whole loop.
<p>The dashboard (<code>pyaerial web</code>) is a separate FastAPI + React process that reads snapshots from Redis and opens SQLite read-only. Heavy browser traffic or a stuck WebSocket client can never slow down radio decoding—and that boundary isn't just a convention. CI runs <code>import-linter</code> contracts that literally fail the build if the web app or API ever imports a writer module.</p>"""
figure = "media/projects/pyaerial/pipeline.svg"
caption = "The split between the write-only tracking engine and the read-only web portal."

[[projects.essay]]
heading = "Spoofing checks, CPR math, and geofences"
body = """ADS-B isn't authenticated, so anyone with an SDR can broadcast a fake plane. Rather than trusting decoded positions blindly, PyAerial compares what an aircraft claims against what the receivers actually measured—running up to 16 physical and protocol checks depending on the hardware attached, from angle-of-arrival and TDOA multilateration to RSSI-versus-range curves, line-of-sight radio horizons, timing jitter, and frame replay detection. Every aircraft gets a rolling 0-to-1 spoofing score, and suspicious flights stay tagged in the archive instead of being silently tossed out.
<p>Even honest packets have plenty of ways to go wrong. Compact Position Reporting splits latitude and longitude across alternating even and odd frames and needs a local reference point to resolve them unambiguously; if you lazily use a geofence polygon as that reference, a distant receiver can decode a completely plausible ghost position. PyAerial anchors decoding to a fixed station coordinate, rejects 0.5° jumps, wraps compass sectors properly across north (350° to 10° is a 20° wedge, not 340°), and evaluates Shapely polygons loaded from KML, KMZ, or GeoJSON using explicit altitude, speed, and ETA rules. Because a curved-path ETA can blow up when a turn circle gets huge, the gate takes <code>min(curved, straight)</code> and applies dwell hysteresis so a brief graze doesn't page everyone.</p>"""
figure = "media/projects/pyaerial/geofence.svg"
caption = "Decode with a fixed reference, compute kinematics and ETA, then apply dwell hysteresis before alerting."

[[projects.essay]]
heading = "Crash recovery and deployment"
body = """Field servers lose power and get restarted at bad times. If <code>pyaerial run</code> dies mid-alert, the next startup replays uncommitted episodes from a Redis outbox and cleanly closes any alerts left hanging with an <code>ended_by: restart</code> event, guaranteeing every activation gets a matching deactivation. If SQLite is momentarily locked or unreachable, completed flights wait in a bounded in-memory retry buffer until the disk comes back.
<p>The whole stack runs under Docker Compose, either pointing at an existing dump1090 host, spinning up an RTL-SDR container directly with <code>--profile sdr</code>, or replaying a bundled sample capture on a laptop with no radio hardware at all.</p>"""

