preview_caption = "The homepage, with projects grouped by area and year and hover previews tucked in the corner."

[[projects.essay]]
heading = "Deleting the clever parts"
body = """Earlier versions of this site tried way too hard. The first draft of v3 had a full custom HTML5 canvas engine running twelve interactive physics and particle simulations—flocking, orbits, Game of Life, aurora waves—behind frosted glass panels with a live tuning drawer. It was a fun JavaScript exercise, and it also made the site heavier, harder to read, and a pain to tweak whenever I just wanted to add a new project or fix a typo.
<p>Eventually I ripped the canvas engine, Tailwind, and the card layout completely out and rebuilt the site around a quiet, typographic layout inspired by Bret Victor's worrydream. Content lives in <code>site.toml</code>, blog posts live as plain Markdown files with TOML frontmatter in <code>posts/</code>, and <code>generator.py</code> renders everything through Jinja2 templates into <code>dist/</code> for GitHub Pages. No npm, no bundler, no CMS.</p>"""

[[projects.essay]]
heading = "Small build-time details"
body = """Keeping the runtime tiny meant putting a few thoughtful touches into the build script instead. Architecture SVGs are inlined directly on project pages so they inherit page colors cleanly, with <code>generator.py</code> rewriting every SVG's internal IDs and class names on the fly so two diagrams on the same page never step on each other's arrow markers. On the homepage, hovering a project row pops up a corner preview using either a dedicated screenshot or the project's hero diagram.
<p>Before finishing, the generator scans every generated HTML file and checks that every local image, stylesheet, and link actually exists inside <code>dist/</code>. Adding a new project or blog post is just editing text and pushing to GitHub—the Actions workflow builds and deploys it in a few seconds.</p>"""
figure = "media/projects/portfolio/modes.svg"
caption = "Everything compiles ahead of time—nothing runs on the client except the hover preview dock and the contact form."

