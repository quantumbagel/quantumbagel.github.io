date = "2026 - Present"
description = "This site: a tiny Python and Jinja2 static generator driven by a single TOML file and Markdown posts, designed to load fast and stay out of the way."
built = "Everything you're reading is compiled from <code>site.toml</code> and TOML-frontmatter Markdown files in <code>posts/</code> by a single Python script (<code>generator.py</code>) using Jinja2 templates. It outputs a self-contained <code>dist/</code> folder for GitHub Pages, inlines and scopes project SVG diagrams so CSS classes never collide, validates that no local asset link is broken at build time, and adds lightweight hover previews on the homepage."
challenges = [
    "Version 3 actually started out with a 12-mode HTML5 canvas particle engine behind frosted cards; stripping all of that back out for a clean, typographic static site made the whole thing faster, easier to read, and way less annoying to maintain.",
    "Inlining multiple SVG architecture diagrams on the same page caused CSS class names and <code>&lt;marker&gt;</code> IDs to collide across figures until the generator started prefixing every SVG's IDs and classes automatically.",
    "Hover previews load those same diagrams inside an <code>&lt;img&gt;</code> tag where page CSS doesn't apply, so each SVG needed an explicit root <code>color</code> attribute to stay legible in both inline and preview contexts.",
]
learned = "A plain TOML file, Jinja2, and a single build script beat a JavaScript framework every single time for a personal site—especially when you actually want to update it."
