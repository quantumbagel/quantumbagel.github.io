    "Shared <code>site.css</code> plus scoped per-page stylesheets, zero frontend build pipeline, and no external JS dependencies.",
    "Draft-aware Markdown blog with automatic reading-time estimates, standalone figure support, and GitHub Actions deployment.",
    "Build-time asset verification that fails loudly if any page references a missing image or diagram.",
]
