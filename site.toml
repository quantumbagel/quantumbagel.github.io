date = "2026"
description = "A campus parking forecaster for NC State decks that pairs live occupancy polling and Localist event schedules with a strict gate: XGBoost only ships for a lot if it beats an hour-of-week median."
details = "A personal forecasting stack built to answer one question: if I drive to this NC State deck at this time, how full is it going to be? A background collector polls NC State's public parking API (storing delta-only snapshots in UTC and clamping negative visitor free_spaces to 100% full) plus campus Localist events into PostgreSQL. Features build out a 5-minute Eastern-time grid with lags, rolling stats, haversine distances to nearby events, and hardcoded NCSU academic calendar dates. An hour-of-week median baseline is always fit first; per-lot XGBoost models across eight horizons (15 minutes to 24 hours) are only kept when they beat that baseline on validation MAE. Training runs as a separate file-queued job inside the collector container (memory-capped at 4 GB) so the Streamlit dashboard never even imports XGBoost. Private repo."
skills = ["Python", "PostgreSQL", "XGBoost", "pandas", "Streamlit", "Docker"]
page = true
tone = "80"
hero = "media/projects/ncsuparking/pipeline.svg"
hero_caption = "Occupancy API and campus events into Postgres, benchmarked against an hour-of-week median before Streamlit ever sees a forecast."

[[projects.essay]]
heading = "Trying to predict whether a deck will be full"
body = """NC State publishes live spot counts for its campus parking decks, which tells you whether a deck is full right now—about twenty minutes too late if you're already driving there. I wanted something that answers a simpler question: if I head to this deck at 10:30 AM tomorrow, am I going to get a spot?
<p>I built this as a private Dockerized stack backed by PostgreSQL and a Streamlit dashboard with views for finding the emptiest lot at a target time, plotting 24-hour curves against a typical day, and browsing historical patterns. The collector records delta-only snapshots from the public API (fixing quirky visitor-deck feeds that occasionally report negative <code>free_spaces</code> by clamping them to 100% full) and generates forecasts across eight horizons from 15 minutes out to 24 hours.</p>"""

[[projects.essay]]
heading = "Making the ML model earn its spot"
body = """Campus parking is brutally cyclical. A Tuesday at 10:00 AM looks almost identical to last Tuesday at 10:00 AM, which means a plain hour-of-week median is already a surprisingly tough baseline to beat—and it works starting from the very first day of polling while you're still collecting data. A lot of toy ML projects skip that comparison and celebrate a gradient-boosted tree for rediscovering class schedules.
<p>My training job always fits the seasonal median first and only keeps a per-lot XGBoost model if it achieves lower validation MAE across the forecasting horizons. If a quiet deck follows clockwork schedules and XGBoost overfits it, the model gets thrown out and that lot stays on the median. Training runs on an hourly check (or on demand via a file queue from the dashboard) inside the collector process with a 4 GB memory cap, writing pickled artifacts to a shared Docker volume so the Streamlit frontend stays fast and never loads XGBoost at runtime.</p>"""
figure = "media/projects/ncsuparking/pipeline.svg"
caption = "The whole point of the pipeline is the gate in the middle: if XGBoost can't beat the median, it doesn't ship."

[[projects.essay]]
heading = "Why class schedules aren't enough"
body = """Where a plain seasonal median falls flat is game days, concerts, and big campus events. A second collector scrapes NC State's Localist event feed, geocodes each venue, and computes haversine distances from every event to every parking deck alongside academic-calendar flags (breaks, exams, reading days). Those distance features give the per-lot models advance warning when a Saturday afternoon isn't going to behave like a normal Saturday."""

