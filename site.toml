[[projects.essay]]
heading = "Filming autonomous flights automatically"
body = """Clean video of autonomous drone flights at AERPAW helps with demos, debugging, and post-flight review, and following a fast multicopter across an open field with a joystick gets frustrating quickly, especially when multiple vehicles are up at once. DroneTracker (<a href="https://github.com/quantumbagel/DroneTracker">quantumbagel/DroneTracker</a>) was my first real project at AERPAW. It points an AXIS Q-8615E pan-tilt-zoom camera at flying vehicles using the testbed's Kafka telemetry bus and records the flight over VAPIX.
<p>Version 1 tracked a single drone by turning each GPS packet into an absolute pan/tilt/zoom command. That worked, though the video looked stepped and it could only follow one target. Version 2 was a full rewrite that tracks several drones at once, filters noisy packets, frames groups when drones fly close together, and decides on its own when to start and stop recording.</p>"""

[[projects.essay]]
heading = "Kalman filters and continuous motion"
body = """Each incoming position report goes into that drone's constant-velocity Kalman filter, working in a local East-North-Up frame (in meters) centered on the lens. The filter smooths out GPS jitter, handles irregular or out-of-order packets, and uses the sender's measurement timestamp to account for network transit delay so the camera aims where the drone will be when the command takes effect. Version 2 also rejects v1's ambiguous <code>{x, y, z}</code> velocity messages and expects explicit North/East/Down fields.
<p>On every control tick, the tracker reads the camera's real position and sets continuous pan and tilt speeds equal to the target's angular rate (feedforward) plus a proportional pointing-error term (feedback). Zoom follows a calibrated field-of-view model for the Q-8615E. If a drone climbs above or drops below the camera's mechanical tilt limits, the controller widens the zoom by the shortfall so the aircraft stays in frame as long as the lens allows.</p>"""
figure = "media/projects/dronetracker/aim.svg"
caption = "Surveyed camera pose and live ENU state mapped to spherical bearing, elevation, and optical zoom."

[[projects.essay]]
heading = "Multi-drone framing and recording"
body = """In <code>auto</code> mode, a drone becomes active once it has been fresh, airborne, in range, above minimum elevation, and inside the visible sector for a configured hold time. It only deactivates after failing those checks for several seconds, so brief telemetry dropouts do not cut the video into pieces. Target selection follows manual Kafka picks first, then a configured priority list, then whichever drone activated first, pulling additional drones into a group shot while everything still fits inside <code>max_group_hfov</code>.
<p>Recording needed its own library work. The existing Python VAPIX library (<code>sensecam-control</code>) supported movement commands but had no way to start, stop, or export recordings from the camera's SD card, so I forked it as <a href="https://github.com/quantumbagel/sensecam-control-record">sensecam-control-record</a>. Recording runs on separate background threads so a slow camera export never blocks tracking, saving each flight as <code>session-&lt;UTC&gt;.mkv</code> next to a 2 Hz <code>.jsonl</code> log of which drones were in frame, where each one was, and where the camera pointed. Operators can list and stream recordings directly over TCP using Kafka commands, and a dry-run mode lets me test changes on a laptop without a camera attached.</p>"""
figure = "media/projects/dronetracker/geometry.svg"
caption = "The v2 pipeline: Kafka ingestion, per-drone Kalman filtering, target selection, continuous PTZ control, and threaded VAPIX recording."

