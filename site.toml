[[projects.essay]]
heading = "The job"
body = """DroneTracker keeps an AXIS Q-8615E pointed at an AERPAW UAV and records the pass. Positions and velocities arrive on Kafka. Commands leave over VAPIX. Recordings land on the camera SD card as Matroska. The repo is <a href="https://github.com/quantumbagel/DroneTracker">quantumbagel/DroneTracker</a>.
<p>This is the featured project that actually uses Kafka. PyAerial does not. I keep saying that because the AERPAW-adjacent repos share a vocabulary and not a stack.</p>"""

[[projects.essay]]
heading = "Geometry before CGI"
body = """Pan is a spherical bearing from the camera to the aircraft. Tilt is elevation. Zoom is a Q-8615E field-of-view model mapped into 0–9999 steps, using slant range and a configured drone size. YAML holds site pose, FOV scale, and that size. If those numbers are wrong, VAPIX will faithfully stare at the wrong sky.
<p>Camera north-offset has to wrap into AXIS ±180° pan. Optional velocity lead is NEU; a NED source will look fine until vz is the wrong sign. I forked <a href="https://github.com/quantumbagel/sensecam-control-record">sensecam-control-record</a> because stock sensecam-control could PTZ and could not start a recording.</p>"""
figure = "media/projects/dronetracker/aim.svg"
caption = "The useful diagram is the triangle, not the Kafka topic list."

[[projects.essay]]
heading = "Field ops is the other half"
body = """Kafka lag looks like a tracking bug. A stale packet is a confident wrong pan, so a timeout parks the camera instead of chasing history. Minimum pan/zoom steps exist because command spam does not slew the head faster — it makes it hunt. Digest-auth CGI, host-network Docker, and a dry-run mode without a camera are how this survives a field day.
<p>Closing a telemetry bus onto a physical PTZ is as much ops as math. The library either starts a recording or it does not. There is no dashboard that makes a bad bearing look good.</p>"""
figure = "media/projects/dronetracker/geometry.svg"
caption = "Kafka in, VAPIX out. Everything in the middle is geodesy and a camera model."

