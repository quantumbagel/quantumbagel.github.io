[[projects.essay]]
heading = "Filming autonomous flights without a camera operator"
body = """When researchers run autonomous drone missions out at AERPAW, having clean video of the flight is huge for demos, debugging, and post-flight review. Trying to track a fast multicopter across an open field with a joystick gets old fast—especially when multiple drones are in the air at once. DroneTracker (<a href="https://github.com/quantumbagel/DroneTracker">quantumbagel/DroneTracker</a>) was my first real project at AERPAW, built to point an AXIS Q-8615E pan-tilt-zoom camera at flying vehicles automatically using the testbed's Kafka telemetry bus and record the pass over VAPIX.
<p>Version 1 tracked a single drone by converting each GPS packet into an absolute pan/tilt/zoom position and firing off a command. That worked, but the footage was jerky and single-target only. Version 2 was a ground-up rewrite that tracks multiple drones simultaneously, filters noisy packets, frames groups when they're close together, and decides on its own when to start and stop rolling.</p>"""

[[projects.essay]]
heading = "Kalman filters and smooth camera motion"
body = """Every incoming position report feeds into that drone's constant-velocity Kalman filter, working in a local East-North-Up coordinate frame (in meters) centered on the camera lens. That smooths out GPS jitter, handles irregular or out-of-order Kafka packets, and—when the sender includes a measurement timestamp—predicts forward across network transit delay so the camera aims where the drone actually is by the time the HTTP request lands. (Version 2 explicitly rejects v1's ambiguous <code>{x, y, z}</code> velocity packets and expects named North/East/Down components.)
<p>Instead of stepping the head from angle to angle, the control loop reads the camera's real position every tick and commands continuous pan and tilt speeds equal to the target's angular rate (feedforward) plus a proportional pointing-error correction (feedback). Zoom uses a calibrated field-of-view model for the Q-8615E, and if a drone climbs above or drops below the head's mechanical tilt range, the controller widens the zoom by the angular shortfall so the aircraft stays in frame as long as the lens physically allows.</p>"""
figure = "media/projects/dronetracker/aim.svg"
caption = "From surveyed camera pose and live ENU state to spherical bearing, elevation, and optical zoom."

[[projects.essay]]
heading = "Multi-drone framing and field ops"
body = """In <code>auto</code> mode, a drone only becomes active once it has been fresh, airborne, within range, above the minimum elevation, and inside the camera's visible sector for a configurable window—and it doesn't deactivate until it fails those checks for several seconds, so a brief dropout won't slice a flight into fragments. Target selection respects manual Kafka picks first, then a configured priority list, then first-active, pulling extra drones into a group shot whenever everyone still fits inside <code>max_group_hfov</code>.
<p>Recording turned out to be its own side quest. The existing Python VAPIX library (<code>sensecam-control</code>) could pan and zoom, but couldn't start, stop, or export recordings from the camera's SD card, so I forked it as <a href="https://github.com/quantumbagel/sensecam-control-record">sensecam-control-record</a>. Recording runs on dedicated background threads so a slow camera export never blocks the tracking loop, saving each flight as <code>session-&lt;UTC&gt;.mkv</code> alongside a 2 Hz <code>.jsonl</code> sidecar log of every drone in frame and where the lens was pointed. Operators can even list and stream recordings straight over TCP using Kafka commands, and a dry-run mode lets me test changes on a laptop without a camera attached.</p>"""
figure = "media/projects/dronetracker/geometry.svg"
caption = "The v2 pipeline: Kafka ingestion, per-drone Kalman filtering, target selection, continuous PTZ control, and threaded VAPIX recording."

