[[projects.essay]]
heading = "An emulator inside Scratch"
body = """Scratch is meant for teaching beginners: you get variables, lists, and custom blocks, no bitwise math, no return values from functions, and a 30 fps frame rate cap. I wanted to see if a real 8-bit console could run inside it anyway. The ColecoVision was a good target because its hardware is clean and well documented: a Z80 CPU, a TMS9918A video chip, and an SN76489 sound chip.
<p>Dragging thousands of blocks by hand would have been miserable, so I wrote the emulator in goboscript (which compiles text source into a standard <code>.sb3</code> file) and generated the repetitive CPU logic with Python. Version 1.0 went up on Scratch in November 2026, followed by v1.1 with a pixel-perfect 1:1 picture mode that runs noticeably smoother in stock Scratch. In TurboWarp, which compiles Scratch projects to JavaScript, cartridges run at a full 60 fps.</p>"""

[[projects.essay]]
heading = "Compiling a Z80 down to 2,900 blocks"
body = """A Python script emits the Z80 core directly into goboscript. Registers live in sprite variables, the 64K address space is a Scratch list, and opcode dispatch walks an 8-level binary tree of comparisons. Since Scratch has no bitwise AND, OR, or XOR, the core builds a 64K AND table on startup, computes OR and XOR arithmetically, and reads flag bits out of precomputed ADD, SUB, and CP tables.
<p>The first working core was about 17,000 blocks. Merging opcodes that only differ by register or condition into shared handlers, reusing one instruction set for both IX and IY, and pulling common operations into custom blocks shrank it down to 2,900 blocks. All 1,604 documented and undocumented opcodes pass 39,715 SingleStepTests CPU vectors (checking registers, flags, memory writes, and cycle counts) on both stock Scratch and TurboWarp.</p>"""

[[projects.essay]]
heading = "Pen graphics, clone sound, and the 5 MB limit"
body = """Scratch has no framebuffer, so the screen is drawn with pen strokes. The renderer tracks which 8-pixel cells changed on each scanline, merges adjacent pixels of the same color into a single line, and avoids painting over an already-drawn pixel because WebGL's anti-aliased pen edges let the color underneath bleed through. Sound uses one clone per SN76489 channel, looping a short waveform and adjusting Scratch's pitch and volume effects.
<p>Scratch also caps project files near 5 MB, which gets tight once you include a BIOS, lookup tables, and a cartridge library (my full build packs 153 games; a fresh checkout bundles six free CVBasic demos and the 240p Test Suite). Running the emulated machine inside a sprite clone keeps about 2 MB of live RAM, VRAM, and tables out of the saved <code>.sb3</code> since Scratch never serializes clones. Cartridges and save states use an LZ4-style compressor written in both Python and Scratch, encoded in a 64-character alphabet without lowercase letters because Scratch list lookups ignore case.</p>"""
figure = "media/projects/coleco/test-suite.png"
caption = "Artemio Urbina's 240p Test Suite (ported to the ColecoVision by Oscar Toledo G.), which boots by default as a quick video, sound, and input check."

[[projects.essay]]
heading = "Testing a Scratch project like normal software"
body = """The test suite drives the compiled project headlessly inside TurboWarp's VM. A mock renderer rasterizes the pen commands and compares the output pixel-for-pixel against an independent TMS9918A reference renderer, including verifying that incremental redraws match a full-frame draw. Separate tests navigate the in-emulator menu with simulated keys and clicks (including the ranked fuzzy search where <code>dk</code> finds Donkey Kong and <code>mdc</code> finds Mr. Do's Castle), check every sound channel against a model of Scratch's audio engine, and save and reload the project to make sure no big working lists leak into the file.
<p>A library check boots every cartridge past its title screen and saves a contact sheet of the first frame each one draws. It cannot prove every game is beatable to the end, though it immediately catches when a change breaks a video mode or boot path.</p>"""
figure = "media/projects/coleco/library.png"
caption = "Contact sheet from the library check, booting each cartridge in the emulator and capturing its opening screen."

