[[projects.essay]]
heading = "Building a host for multiple games"
body = """My earlier Discord game bots (Piranha and the original PlayCord) kept hitting the same problem: game logic, Discord embeds, and temporary in-memory dicts were all tangled together. Whenever the bot restarted, every active game vanished, and adding another game meant rewriting lobbies, turn timers, and forfeits all over again. I wrote Strife from scratch as a shared host that separates match management from the games themselves.
<p>Players start lobbies with <code>/play</code> (public or private, with pre-approvals, blacklists, and optional bots), and once everyone readies up, the match runs inside its own thread so it does not clutter the main channel. Seven games ship out of the box (Tic-Tac-Toe, Connect Four, Chess including Chess960, Coup, Mafia, Spyfall, and Liar's Dice), and extra games load from a <code>plugin.toml</code> manifest declaring versions, dependencies, and custom application emoji. Games run in-process for per-match fault isolation (so a broken game only crashes its own match), not as a security sandbox, which is why plugin installation is owner-only.</p>"""

[[projects.essay]]
heading = "Crash-safe resume and a shared play() loop"
body = """Every game subclass stays completely separate from <code>discord.py</code> and talks only to <code>GameContext</code>, a small interface for updating the board view, requesting input, sending private DMs, and drawing from a seeded <code>self.rng</code>. Because the game never touches Discord directly, the exact same <code>play()</code> method runs live in a thread (<code>LiveContext</code>), steps through completed games via <code>/strife replay</code> using a 6-character code (<code>ReplayContext</code>), and runs locally in a terminal or test suite (<code>MockContext</code>).
<p>PostgreSQL 16 holds guilds, win/loss records, and an append-only move log for every match. If the bot restarts while games are active, it checks the database on boot, recreates each game with its original RNG seed, and replays the recorded moves back to the current turn before re-enabling controls. If a plugin build changed underneath an open match, the host abandons it cleanly rather than corrupting the state.</p>"""
