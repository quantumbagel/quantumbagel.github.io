[[projects.essay]]
heading = "The testbed"
body = """AERPAW (Aerial Experimentation and Research Platform for Advanced Wireless) is NC State's NSF testbed for running 5G/6G wireless experiments on real autonomous vehicles. Visiting researchers write Python scripts to fly custom multicopters like the LAM6 and SAM4, or drive ground rovers, all built around Cube Orange flight controllers running ArduPilot and speaking MAVLink v2. The vehicles carry software-defined radios and other custom RF payloads out at Lake Wheeler, so there's zero room for a buggy script to wander off.
<p>Between every experimenter script and the autopilot sits a MAVLink safety filter. Telemetry streams back unrestricted, so scripts can read whatever state they want, but outbound commands go through a strict allow-list: takeoff (between 20 and 100 meters), landing (within 5 meters of the takeoff point), yaw, and waypoints inside the field geofence—plus extra creek no-go polygons for the rover. Anything outside those bounds gets dropped silently or rejected, which means the filter ends up defining what the library can actually do.</p>"""

[[projects.essay]]
heading = "Moving off DroneKit without breaking everyone's scripts"
body = """John Kesler wrote the original aerpawlib on top of DroneKit and pymavlink, giving experimenters simple <code>Runner</code> and <code>StateMachine</code> base classes along with QGroundControl <code>.plan</code> file support. That worked well for years, until DroneKit went unmaintained and newer Python and ArduPilot versions started breaking underneath it. I took over as primary maintainer of <a href="https://github.com/AERPAW/aerpawlib">AERPAW/aerpawlib</a> to migrate the backend onto MAVSDK so the testbed could move forward without monkey-patching Python.
<p>The catch was that dozens of existing sample experiments and researcher scripts already depended on the v1 API. Instead of forcing a flag-day rewrite, I kept v1 intact—DroneKit-shaped telemetry wrappers and a dual asyncio/gRPC bridge so older synchronous-looking scripts still run untouched—and built a v2 API alongside it. v2 uses native Python <code>async</code>/<code>await</code> on a single event loop with explicit preflight checks (<code>can_takeoff</code>, <code>can_goto</code>, <code>can_land</code>) and cancellable <code>VehicleTask</code> handles.</p>"""

[[projects.essay]]
heading = "Living with the safety filter"
body = """Most of the interesting bugs in the 1.4.x releases came straight from how MAVSDK interacts with AERPAW's filter. Standard <code>SET_MODE</code> commands aren't on the allow-list, and calling <code>action.hold()</code> puts the vehicle into LOITER, which severs the Experiment VM's control link. To keep the drone in GUIDED without getting kicked off, the library sends raw <code>MAV_CMD_DO_SET_MODE</code> commands instead. Even auto-RTL had a trap: aborting a mission used to try flying home at <code>home.alt ≈ 0</code>, which tripped the 20-meter altitude floor and got blocked immediately.
<p>Supporting active field flights surfaced plenty of smaller, subtler bugs too. Expiring <code>set_velocity</code> timers were cancelling newer velocity commands, <code>Coordinate.bearing</code> ignored cosine latitude scaling (off by about 6 degrees at Lake Wheeler), and <code>ExternalProcess</code> quietly dropped redirected stdin/stdout files. Multi-vehicle coordination had its own growing pains: ZeroMQ PUB/SUB was dropping state transitions whenever nodes started out of sync, so the control plane on ports 5570/5571 now speaks JSON with explicit ACKs, HELLO handshakes, and a <code>wait_for_peers</code> barrier.</p>"""
figure = "media/projects/aerpawlib/filter.svg"
caption = "Telemetry comes back unrestricted, while outbound commands have to clear the allow-list and the Companion VM's KML geofence."

[[projects.essay]]
heading = "Testing before flight day"
body = """Unit tests run in CI across Python 3.10 through 3.14, and the integration suite spins up real ArduCopter and ArduRover SITL instances alongside <code>mavsdk_server</code>, resetting the vehicles between test cases. (One fun quirk: MAVProxy blocks if its stdout is piped, so the suite has to run with output capture disabled.) SITL catches regressions before anyone drives out to the field, though real hardware flights still get the final vote whenever the filter or radio link behaves differently than a local sim."""

