[[projects]]
category = "discord-bots"
title = "Triggered"
date = "2023 - 2026"
description = "An IFTTT-style automation bot for Discord where moderators wire up event triggers and actions through slash commands, backed by a JSON registry and MongoDB."
details = "I built Triggered so I could stop writing one-off cogs every time someone asked for 'when X happens in Discord, do Y.' Users pair triggers (messages, reactions, voice joins, role changes, recurring schedules) with up to three 'do' actions through slash commands. Available triggers and actions load dynamically from a JSON registry (requirements.json) that powers both autocomplete and validation, while rules, server permissions, and personal allow/blocklists live in MongoDB. Packaged with Docker Compose and pytest; my hosted instance is personal, so anyone running it for real should self-host."
link = "https://github.com/quantumbagel/Triggered"
skills = ["Python", "discord.py", "MongoDB", "Docker"]
page = true
tone = "350"
hero = "media/projects/triggered/rules.svg"
hero_caption = "Discord events pass through the JSON trigger and action registry and fire matching rules stored per server in MongoDB."

[[projects.essay]]
heading = "IFTTT inside a Discord server"
body = """Active Discord servers always end up with a bunch of small automation requests: grant a role when someone reacts to a post, ping a channel when a friend joins voice, or drop a recurring reminder. Writing custom bot code for each one gets repetitive fast. Triggered lets moderators assemble those rules themselves with <code>/triggered new</code> and <code>/triggered add</code>, pairing a trigger ("when X happens") with one or more actions ("then do Y").
<p>Rules, per-server admin permissions, and per-user allow/blocklists all live in MongoDB (preferably local Mongo, since the bot hits the database often enough to burn through a free cloud tier). Only the rule's author or the server owner can edit or attach actions to it, and rules cannot run privileged actions unless the server has explicitly allowed them.</p>"""

[[projects.essay]]
heading = "A JSON registry for triggers and actions"
body = """Early on, adding a new trigger meant editing half a dozen files to update slash options, autocomplete, and validation. Moving the catalog into a single JSON registry (<code>requirements.json</code>) cleaned that up: the registry lists every trigger and action type along with its module and expected arguments, and the slash command layer reads it dynamically to populate autocomplete and reject invalid inputs before anything hits MongoDB.
<p>If a saved rule ever references a trigger or action that was removed, it fails closed instead of running half-built logic. My hosted instance is just for personal servers, and the project mainly served as the point where I stopped writing disposable single-purpose cogs.</p>"""
figure = "media/projects/triggered/rules.svg"
caption = "Incoming events match against the registry, check permissions, and run stored per-server rules."

