[[projects.essay]]
heading = "Reading playback without scraping HTML"
body = """Discord has built-in Spotify integration, while Amazon Music users usually end up with extensions that scrape CSS classes out of the web player and break whenever Amazon updates their site. I built this extension (currently v1.8.1) to avoid scraping the DOM altogether.
<p>The primary source is the browser's built-in Media Session API (the same interface that powers keyboard media keys and lock-screen controls), which gives title, artist, artwork, position, and play/pause state through a browser standard that survives redesigns. For details Media Session leaves out (links, whether you are playing an album, playlist, or station, artist photos, release year, and HD/Ultra HD stream quality), one page hook queries Amazon's own player API from your signed-in session. Keeping all of that in a single file means there is only one place to update if Amazon ever changes an endpoint.</p>"""

[[projects.essay]]
heading = "The Rust helper"
body = """Browser extensions cannot open local Unix sockets or Windows named pipes directly, so they cannot speak Discord's local IPC on their own. To avoid shipping a heavy desktop tray app, I wrote a small native-messaging host in Rust. You download the binary and open it once; it copies itself into your user folder and registers its manifest for every Chromium and Firefox browser it finds on macOS, Windows, or Linux. After that, the browser starts and stops it automatically in the background.
<p>Discord caps Rich Presence at five updates every twenty seconds, so the helper coalesces incoming updates, holds extra ticks back until the window opens, and reconnects on its own whenever Discord closes and reopens. The extension popup adds custom status templates with a live preview, separate formatting for podcasts, quick snooze timers, and a 'Never show' list for specific tracks, artists, or playlists.</p>"""
figure = "media/projects/amazon/rpc.svg"
caption = "Tab hook to extension to Rust native-messaging host to Discord IPC, with coalescing at the host boundary."

