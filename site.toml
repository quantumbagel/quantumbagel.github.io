[[projects]]
featured = true
category = "solo"
title = "Portfolio Website (v3)"
date = "2026 - Present"
description = "This site: a small Python and Jinja2 static generator driven by one TOML file and Markdown posts, built to load fast and stay simple."
built = "Everything on this site is generated from <code>site.toml</code> and TOML-frontmatter Markdown files in <code>posts/</code> by a single Python script (<code>generator.py</code>) using Jinja2 templates. It writes a self-contained <code>dist/</code> folder for GitHub Pages, inlines and scopes project SVG diagrams so CSS classes never collide, verifies at build time that every local asset link exists, and adds lightweight hover previews on the homepage."
challenges = [
    "Version 3 originally shipped with a 12-mode HTML5 canvas particle engine behind frosted cards. Ripping all of that out for a clean typographic layout made the site faster, easier to read, and much simpler to update.",
    "Inlining multiple SVG architecture diagrams on the same page caused CSS class names and <code>&lt;marker&gt;</code> IDs to collide across figures until the generator began prefixing every SVG's IDs and classes automatically.",
    "Hover previews load those same diagrams inside an <code>&lt;img&gt;</code> tag where page CSS does not apply, so each SVG needed an explicit root <code>color</code> attribute to stay legible in both inline and preview contexts.",
]
learned = "A plain TOML file, Jinja2, and one build script beat a JavaScript framework for a personal site, especially when you actually want to keep it updated."
features = [
    "Single-file Python static generator compiling <code>site.toml</code> and <code>posts/*.md</code> into minified static HTML in <code>dist/</code>.",
    "Shared <code>site.css</code> plus per-page stylesheets, zero frontend build pipeline, and no external JS dependencies.",
    "Draft-aware Markdown blog with reading-time estimates, standalone figure support, and GitHub Actions deployment.",
    "Build-time asset check that fails loudly if any page references a missing image or diagram.",
]
link = "https://github.com/quantumbagel/quantumbagel.github.io"
skills = ["Python", "Jinja2", "TOML", "HTML / CSS"]
page = true
tone = "199"
hero = "media/projects/portfolio/modes.svg"
hero_caption = "site.toml and Markdown posts go into generator.py with Jinja2 templates, coming out as static HTML and verified assets in dist/."
preview = "media/projects/portfolio/homepage.png"
preview_caption = "The homepage, with projects grouped by area and year and hover previews tucked in the corner."

[[projects.essay]]
heading = "Stripping it back down"
body = """Earlier versions of this site did way too much. The first draft of v3 had a custom HTML5 canvas engine running twelve interactive physics and particle simulations (flocking, orbits, Game of Life, aurora waves) behind frosted glass cards with a live settings drawer. It was a fun JavaScript project, though it made the site heavier, busier to read, and annoying to edit whenever I just wanted to add a project or fix wording.
<p>Eventually I deleted the canvas engine, Tailwind, and the card layout and rebuilt everything around a simple typographic design inspired by Bret Victor's worrydream. Content lives in <code>site.toml</code>, blog posts are plain Markdown files with TOML frontmatter in <code>posts/</code>, and <code>generator.py</code> renders everything with Jinja2 into <code>dist/</code> for GitHub Pages. No npm, no bundler, and no CMS.</p>"""

[[projects.essay]]
heading = "Build-time details"
body = """Keeping the browser side minimal meant putting a few helpful checks into the build script. Architecture SVGs are inlined directly on project pages so they inherit page colors, and <code>generator.py</code> rewrites every SVG's internal IDs and class names on the fly so two diagrams on the same page never clash over arrow markers. On the homepage, hovering a project row pops up a corner preview using either a dedicated screenshot or the project's hero diagram.
<p>Before exiting, the generator scans every output HTML file and verifies that every local image, stylesheet, and link actually exists inside <code>dist/</code>. Publishing a new project or blog post is just editing text and pushing to GitHub, where the Actions workflow builds and deploys it in a few seconds.</p>"""
figure = "media/projects/portfolio/modes.svg"
caption = "Everything compiles ahead of time, leaving only the hover preview dock and the contact form running in the browser."

