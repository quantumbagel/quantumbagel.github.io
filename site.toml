[[projects.essay]]
heading = "Context"
body = """In summer 2026 I interned with Merrill Lynch Wealth Management, working on an internal calculations platform used for portfolios holding over <strong>$500M</strong> in assets. Analysts regularly pulled fundamentals and price history from FactSet, applied team-specific valuation formulas, and formatted spreadsheets for review. Because ML-Ticker is proprietary internal software, the repo is private and I am not sharing internal tickers, formulas, or entitlements, just the architecture of the pipeline.
<p>The tool runs as a packaged Python CLI inside FactSet's Programmatic Environment. Analysts define the tickers, fields, and derived metrics they want in a YAML file, run one command, and get either a formatted terminal table or a styled Excel workbook.</p>"""

[[projects.essay]]
heading = "Validating configs before touching FactSet"
body = """FactSet FQL queries are easy to mistype and slow enough that finding a typo halfway through a batch run wastes a lot of time. ML-Ticker validates the full YAML config with strict Pydantic models (extra fields forbidden) before sending any network requests. Holdings snapshots and historical time series have separate config models, and an FDT mode scores a company against peers to compute Bull, Base, and Bear valuation multiples.
<p>Custom formulas go through a restricted Python AST checker that walks the syntax tree against an allowlist of math operators and safe builtins, rejecting attribute lookups, imports, and anything outside arithmetic. Next, the engine builds a dependency graph of all metrics, computes a topological sort by hand, prints the exact cycle path if formulas reference each other in a loop, and suggests close matches for misspelled metric names. Once the graph passes, the query planner batches the FQL calls (including a second pass when a formula needs additional lookups).</p>"""
figure = "media/projects/ml-ticker/pipeline.svg"
caption = "Validate first, plan the FactSet batches, derive in topological order, then export."

[[projects.essay]]
heading = "Handling missing data"
body = """Real market feeds have plenty of gaps: a company does not report a field, a historical series starts late, or a denominator comes back empty. Quietly coercing missing fields to zero produces plausible-looking multiples that are completely wrong. ML-Ticker keeps missing values as explicit typed N/A objects through every formula step so absent inputs and divide-by-zero cases show up visibly in the output.
<p>Once everything is computed, quick lookups print as colorized Rich tables in the terminal, scripts can consume JSON, and review deliverables export via <code>openpyxl</code> to multi-sheet Excel workbooks that put raw inputs and intermediate calculations onto hidden helper sheets behind the main summary tab.</p>"""

