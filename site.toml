[[projects.essay]]
heading = "What I can say"
body = """ML-Ticker was internship work at Merrill Lynch: a Python CLI against FactSet FQL, used on a calculations platform that sits on <strong>$500M+</strong> AUM. There is no public GitHub link. I am not going to describe internal tickers, entitlements, or anything that looks like a leak dressed up as a portfolio bullet.
<p>What I will describe is the shape of the system, because that shape is the work.</p>"""

[[projects.essay]]
heading = "Sandbox, then graph"
body = """FQL is powerful and easy to get wrong. The CLI takes YAML/Pydantic configs (extra fields forbidden), validates a restricted formula language, plans the FactSet calls, then evaluates Python metrics in topological order. Holdings and timeseries are different config models. Some formulas need a second-pass fetch. FDT mode scores a name against peers into Bull / Base / Bear multiples.
<p>It only runs inside FactSet's Programmatic Environment. That is a real constraint, not a footnote.</p>"""
figure = "media/projects/ml-ticker/pipeline.svg"
caption = "Plan → fetch → derive → export. Details stop at the box."

[[projects.essay]]
heading = "Why the AST and the DAG"
body = """Formulas had to be useful without becoming a code-execution hole: AST denylist, allowlisted builtins, no NetworkX. Interdependent metrics get a DAG, a cycle path, and typo suggestions — before any FactSet call. Missing FQL values become typed N/As instead of poisoning a sheet. Export is Rich tables, multi-sheet Excel with hidden helper metrics, JSON.
<p>The failures that hurt were type failures that looked like data failures. Making the graph refuse a silent coerce was more useful than a prettier command. Treat research tooling as a product: validate the language first.</p>"""

