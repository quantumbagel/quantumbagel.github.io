[[projects.essay]]
heading = "From hardcoded scripts to recipes"
body = """fractalgen started as two quick scripts I wrote to generate desktop wallpapers for myself. Every fractal formula, color ramp, and crop lived straight in Python, so trying a new idea meant duplicating a function and tweaking magic numbers. I rebuilt the whole thing around a clean split: generators are registered functions that turn a slice of the plane into field data, and recipes are TOML tables that choose a generator and describe everything else about the final image.
<p>Because recipes can inherit from other recipes, define separate portrait crops for phones, and stack composited layers and effects, most new looks take a handful of TOML lines instead of new code. The same recipe drives the CLI (<code>fractalgen render</code>, including <code>--random</code> for surprises), multi-device batch presets, and the interactive GUI. Version 0.1.0 went up on GitHub in November 2026 under the MIT license.</p>"""

[[projects.essay]]
heading = "Making the math fast enough to play with"
body = """An 8K wallpaper is over 33 million pixels, and plenty of looks iterate each pixel more than a thousand times. The inner loops are compiled with Numba and parallelized across CPU cores. Escape-time kernels run Brent cycle detection so interior points that settle into repeating orbits exit early instead of grinding all the way to the iteration limit. Heavier simulations like Gray-Scott reaction-diffusion and physarum slime mold use multi-threaded solvers, and batch jobs run in isolated worker processes with timeouts so one expensive look can't hang an entire preset.
<p>Interactive editing adds a different problem: nobody wants to wait five seconds just to audition a new palette. The server caches expensive intermediate buffers (iteration counts, density grids) in a bounded LRU cache and applies palettes, tone curves, and post-processing downstream, so recoloring or dialing in bloom feels instant.</p>"""

[[projects.essay]]
heading = "Same picture at 960 px and 16K"
body = """If you spend ten minutes framing a look in a small preview window, the 16K export shouldn't shift the crop or shrink the glow to nothing. Views are anchored to a 4K reference canvas with explicit fill, cover, and contain rules for mismatched aspect ratios, and pixel-radius effects like blur and bloom scale proportionally with the output size.
<p>Exposure had a trickier version of the same bug. Generators that stretch their dynamic range to fit the current frame's histogram would re-expose every time I panned—a bright filament would suddenly dim the second something brighter entered the corner of the screen. Now fractalgen measures those tone statistics once on the recipe's authored view and replays them while you pan and zoom, keeping colors locked to the math rather than the viewport.</p>"""

[[projects.essay]]
heading = "The browser editor"
body = """Running <code>fractalgen gui</code> spins up a local server and opens an editor built with Preact and <code>htm</code> as plain ES modules—no Node build step, no bundler. You can browse all 129 looks, spin up parameter variations, drag and scroll to pan, zoom, and rotate, tweak palettes, layers, and effects with full undo history, and hold backslash to flash back to the original preset.
<p>Exports support 2x and 3x supersampling, and every PNG or JPEG carries its full recipe right in the file metadata. Any finished wallpaper is its own source file—you can hand someone a JPEG and they can fork it straight back into an editable TOML look.</p>"""

