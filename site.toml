[[projects]]
category = "discord-bots"
title = "Triggered"
date = "2023 - 2026"
description = "An IFTTT-style automation bot for Discord where moderators wire up event triggers and actions through slash commands, backed by a JSON registry and MongoDB."
details = "I built Triggered so I could stop writing one-off cogs every time someone asked for 'when X happens in Discord, do Y.' Users pair triggers (messages, reactions, voice joins, role changes, recurring schedules) with up to three 'do' actions through slash commands. Available triggers and actions load dynamically from a JSON registry (requirements.json) that powers both autocomplete and validation, while rules, server permissions, and personal allow/blocklists live in MongoDB. Packaged with Docker Compose and pytest; my hosted instance is personal, so anyone running it for real should self-host."
link = "https://github.com/quantumbagel/Triggered"
skills = ["Python", "discord.py", "MongoDB", "Docker"]
page = true
tone = "350"
hero = "media/projects/triggered/rules.svg"
hero_caption = "Discord events pass through the JSON trigger/action registry and fire matching rules stored per server in MongoDB."

[[projects.essay]]
heading = "IFTTT inside a Discord server"
body = """Every Discord community eventually accumulates a pile of small, weirdly specific automation requests: give someone a role when they react to a post, ping a channel when a friend hops into voice, or drop a reminder on a timer. Writing custom bot code for each one gets tedious fast. Triggered lets people wire those rules together themselves using <code>/triggered new</code> and <code>/triggered add</code>, pairing a trigger ("when X happens") with one or more actions ("then do Y").
<p>Rules, per-server admin permissions, and per-user allow/blocklists all live in MongoDB (preferably local Mongo—the bot hits the database hard enough that a free cloud tier would cry). Only the rule's author or the server owner can edit or attach actions to it, and rules can't run privileged actions unless the server actually granted them.</p>"""

[[projects.essay]]
heading = "A JSON registry instead of giant switch statements"
body = """Early on, adding a new trigger meant editing half a dozen files to wire up slash options, autocomplete, and validation. Moving the catalog into a single JSON registry (<code>requirements.json</code>) fixed that: the registry declares every trigger and action type along with the module and arguments it expects, and the slash command layer reads it dynamically to populate autocomplete and reject bad arguments before anything gets written to MongoDB.
<p>If a stored rule ever references a trigger or action that no longer exists, it fails closed rather than executing half-baked logic. I wouldn't pitch Triggered as a commercial SaaS product—my hosted instance is just for personal servers—but it was the project that finally got me out of the habit of writing disposable one-off cogs.</p>"""
figure = "media/projects/triggered/rules.svg"
caption = "Incoming events match against the registry, validate permissions, and run stored per-server rules."

