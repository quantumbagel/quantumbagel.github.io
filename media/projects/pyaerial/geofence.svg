<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="PyAerial CPR decode and geofence evaluation">
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .fill { fill: currentColor; fill-opacity: 0.08; }
    .t { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; }
    .s { font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; opacity: 0.62; }
    .arr { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
    .poly { fill: currentColor; fill-opacity: 0.1; stroke: currentColor; stroke-width: 1.3; }
    .dot { fill: currentColor; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="currentColor"/>
    </marker>
  </defs>
  <rect class="box fill" x="16" y="28" width="150" height="70"/>
  <text class="t" x="28" y="56">Mode S / ADS-B</text>
  <text class="s" x="28" y="74">dump1090, pyModeS</text>
  <rect class="box fill" x="196" y="28" width="170" height="70"/>
  <text class="t" x="208" y="56">CPR decode</text>
  <text class="s" x="208" y="74">home != fence, 0.5 deg reject</text>
  <rect class="box fill" x="396" y="28" width="160" height="70"/>
  <text class="t" x="408" y="56">Kinematics</text>
  <text class="s" x="408" y="74">Kalman, heading wrap</text>
  <polygon class="poly" points="590,36 730,70 700,150 600,168 560,100"/>
  <circle class="dot" cx="648" cy="92" r="4"/>
  <text class="t" x="574" y="196">Shapely geofence</text>
  <text class="s" x="574" y="214">alt, speed, ETA rules</text>
  <rect class="box fill" x="196" y="200" width="170" height="70"/>
  <text class="t" x="208" y="228">ETA</text>
  <text class="s" x="208" y="246">min(curved, straight)</text>
  <rect class="box fill" x="396" y="200" width="160" height="70"/>
  <text class="t" x="408" y="228">Dwell</text>
  <text class="s" x="408" y="246">hysteresis, no spam</text>
  <path class="arr" d="M166 63 H196"/>
  <path class="arr" d="M366 63 H396"/>
  <path class="arr" d="M556 63 H590"/>
  <path class="arr" d="M281 98 V200"/>
  <path class="arr" d="M366 235 H396"/>
</svg>
