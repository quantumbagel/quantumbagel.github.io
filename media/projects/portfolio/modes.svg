<svg
    xmlns="http://www.w3.org/2000/svg"
    color="#b6d6f6"
    viewBox="0 0 760 220"
    role="img"
    aria-label="Portfolio static generator pipeline"
>
  <style>
    .box { fill: none; stroke: currentColor; stroke-width: 1.4; }
    .fill { fill: currentColor; fill-opacity: 0.08; }
    .t { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; }
    .s { font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; opacity: 0.62; }
    .arr { stroke: currentColor; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
  </style>
  <defs>
    <marker
            id="ah"
            viewBox="0 0 8 8"
            refX="7"
            refY="4"
            markerWidth="6"
            markerHeight="6"
            orient="auto"
        >
      <path d="M0 0 L8 4 L0 8 z" fill="currentColor" />
    </marker>
  </defs>
  <rect class="box fill" x="20" y="24" width="170" height="68" />
  <text class="t" x="36" y="52">site.toml</text>
  <text class="s" x="36" y="70">projects, writeups, bio</text>
  <rect class="box fill" x="20" y="124" width="170" height="68" />
  <text class="t" x="36" y="152">posts/*.md</text>
  <text class="s" x="36" y="170">TOML frontmatter + body</text>
  <rect class="box fill" x="240" y="64" width="210" height="84" />
  <text class="t" x="256" y="96">generator.py + Jinja2</text>
  <text class="s" x="256" y="116">scope SVGs, check assets</text>
  <rect class="box fill" x="500" y="64" width="230" height="84" />
  <text class="t" x="516" y="96">dist/ → GitHub Pages</text>
  <text class="s" x="516" y="116">static HTML, CSS, media</text>
  <path class="arr" d="M190 58 H215 V96 H240" />
  <path class="arr" d="M190 158 H215 V116 H240" />
  <path class="arr" d="M450 106 H500" />
</svg>
