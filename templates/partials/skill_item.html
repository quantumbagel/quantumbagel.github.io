<div id="skill-{item.skill_id}" class="skill-item">
    <div class="skill-toggle card-head" data-skill-id="{item.skill_id}" role="button" tabindex="0" aria-expanded="false">
        <div class="hbox">
            {item.icon_html}
            <span class="item-name">{item.name}</span>
            {item.duration_html}
        </div>
        <div class="hbox">
            <button class="skill-copy-link icon-btn" data-skill-id="{item.skill_id}" title="Copy link to skill" type="button" aria-label="Copy link to {item.name}">
                <i class="bi bi-link-45deg"></i>
            </button>
            <i class="bi bi-chevron-down skill-toggle-icon"></i>
        </div>
    </div>
    <div class="skill-content">
        <div>
            <div class="card-body">
                <span class="chip">{item.level}</span>
                {item.details_html}
                {item.projects_html}
            </div>
        </div>
    </div>
</div>
