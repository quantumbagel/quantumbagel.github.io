<div id="{item.modal_id}" class="backdrop hidden">
    <div class="modal">
        <div class="modal-head">
            <h2>{item.title}</h2>
            <button class="modal-close-btn icon-btn" data-modal-id="{item.modal_id}" type="button">✕</button>
        </div>
        <div class="modal-body">
            {item.details_html}
            {item.gallery_html}
            {item.features_html}
        </div>
        <div class="modal-foot">
            {item.link_button_html}
        </div>
    </div>
</div>
