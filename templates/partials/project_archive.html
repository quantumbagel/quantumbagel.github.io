<article id="{item.project_id}" class="project-card project-archive" data-category="{item.category}">
    <div class="hbox spread">
        <div>
            <h3>{item.title}</h3>
            {item.date_html}
        </div>
        <button class="copy-link-btn icon-btn" data-project-id="{item.project_id}" title="Copy link to project" type="button">#</button>
    </div>
    <p class="look-desc">{item.description}</p>
    {item.notes_html}
    {item.gallery_html}
    <div class="fg-actions">{item.link_html}</div>
</article>
