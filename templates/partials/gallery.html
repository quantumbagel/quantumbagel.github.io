{% if gallery %}{% if gallery.slides %}<figure class="essay-figure media-figure"><div class="media-carousel" data-carousel-id="{{ gallery.id }}"><div class="carousel-slides" style="transform: translateX(0%);">{% for slide in gallery.slides %}<div class="carousel-slide">{% if slide.type == "video" %}<video src="{{ slide.src }}"{% if slide.poster %} poster="{{ slide.poster }}"{% endif %} controls playsinline class="carousel-media" preload="metadata"></video>{% else %}<img src="{{ slide.src }}" alt="{{ slide.alt }}" loading="lazy" decoding="async" class="carousel-media">{% endif %}</div>{% endfor %}</div>{% if gallery.slides|length > 1 %}<button class="carousel-prev icon-btn" type="button" aria-label="Previous slide">‹</button><button class="carousel-next icon-btn" type="button" aria-label="Next slide">›</button><div class="carousel-dots">{% for slide in gallery.slides %}<button class="carousel-dot{% if loop.first %} on{% endif %}" type="button" data-slide-to="{{ loop.index0 }}" aria-label="Go to slide {{ loop.index }}"></button>{% endfor %}</div>{% endif %}</div>{% if gallery.caption %}<p class="essay-caption">{{ gallery.caption | safe }}</p>{% endif %}</figure>{% endif %}{% endif %}
