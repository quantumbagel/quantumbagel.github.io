<article id="{item.project_id}" class="project-card project-writeup" data-category="{item.category}">
    <a href="{item.page_href}">
        {item.hero_html}
        <h3 class="look-name">{item.title}</h3>
        {item.date_html}
        <p class="writeup-dek look-desc">{item.description}</p>
    </a>
    {item.gallery_html}
    <div class="writeup-grid">
        {item.built_html}
        {item.challenges_html}
        {item.learned_html}
    </div>
    {item.skills_html}
    <div class="fg-actions">
        {item.page_link_html}
        {item.link_html}
        {item.demo_html}
    </div>
</article>
