<article id="{item.project_id}" class="project-card" data-category="{item.category}">
    {item.image_html}
    <div class="card-head">
        <h3 class="look-name">{item.title}</h3>
        <button class="copy-link-btn icon-btn" data-project-id="{item.project_id}" title="Copy link to project" type="button">
            <i class="bi bi-link-45deg"></i>
        </button>
    </div>
    {item.date_html}
    <p class="look-desc">{item.description}</p>
    {item.skills_html}
    <div class="fg-actions">
        {item.link_html}
        {item.details_button_html}
    </div>
</article>
