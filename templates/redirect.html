{% extends "base.html" %}
{% block stylesheet %}{% endblock %}
{% block head %}
    <meta http-equiv="refresh" content="0; url={{ redirect.url }}">
    <link rel="canonical" href="{{ redirect.url }}">
    <script>window.location.href = {{ redirect.url | tojson }};</script>
{% endblock %}
{% block body %}
    If you are not redirected, <a href="{{ redirect.url }}">click here</a>.
{% endblock %}
