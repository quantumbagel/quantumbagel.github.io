<!DOCTYPE html>
<html lang="{site.lang}" data-tone="{item.tone}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{item.title} | {user.name}</title>
    <meta name="description" content="{item.description}">
    <link rel="icon" type="image/png" href="{paths.root}{meta.favicon}">
    <script>
        (function() {
            const storedTheme = localStorage.getItem("theme");
            const preferredTheme = storedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            if (preferredTheme === "dark") {
                document.documentElement.classList.add("dark");
            } else {
                document.documentElement.classList.remove("dark");
            }
        })();
    </script>
    <link href="{paths.root}font.css" rel="stylesheet">
    <link rel="stylesheet" href="{paths.root}theme.css">
</head>
<body>
    <canvas id="interactive-bg" aria-hidden="true"></canvas>
    <div class="shell">
        <header class="topbar">
            <a href="{paths.root}" class="brand">{user.name}</a>
            <span class="muted small topbar-kicker">{item.kicker}</span>
            <span class="grow"></span>
            <button id="theme-toggle" class="btn small ghost" type="button" aria-label="Toggle theme" aria-pressed="false">Theme</button>
            <button id="particle-toggle" class="btn small ghost" type="button" aria-label="Background: On" aria-expanded="false" aria-controls="bg-sim-panel">Background</button>
        </header>
        <main class="page">
            <article class="page-card">
                <header class="page-head">
                    <h1 class="look-name big">{item.title}</h1>
                    <p class="look-desc">{item.description}</p>
                    <div class="look-meta">{item.date}</div>
                    <div class="page-actions">
                        {item.link_html}
                        {item.demo_html}
                    </div>
                    {item.skills_html}
                </header>

                {item.hero_html}

                {item.gallery_html}

                {item.built_html}
                {item.challenges_html}
                {item.learned_html}
                {item.features_html}

                {item.essay_html}

                <footer class="page-foot">
                    <a href="{paths.root}#projects" class="btn small">All projects</a>
                    {item.link_html}
                </footer>
            </article>
        </main>
    </div>
    <script type="module" src="{paths.root}particles/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const themeToggle = document.getElementById("theme-toggle");
            const setTheme = (theme) => {
                document.documentElement.classList.toggle("dark", theme === "dark");
                localStorage.setItem("theme", theme);
                if (themeToggle) {
                    themeToggle.setAttribute("aria-pressed", theme === "dark" ? "true" : "false");
                }
            };
            setTheme(document.documentElement.classList.contains("dark") ? "dark" : "light");
            if (themeToggle) {
                themeToggle.addEventListener("click", () => {
                    document.documentElement.classList.add("theme-transitioning");
                    setTheme(document.documentElement.classList.contains("dark") ? "light" : "dark");
                    setTimeout(() => document.documentElement.classList.remove("theme-transitioning"), 180);
                });
            }
            const bindParticleUi = (api) => {
                if (!api) return;
                document.querySelectorAll("[data-open-sim]").forEach((btn) => {
                    btn.addEventListener("click", () => {
                        api.setEnabled(true);
                        api.openPanel();
                    });
                });
            };
            if (window.particleApi) bindParticleUi(window.particleApi);
            else window.addEventListener("particles-ready", (event) => bindParticleUi(event.detail));

            document.querySelectorAll(".media-carousel").forEach((carousel) => {
                const slidesContainer = carousel.querySelector(".carousel-slides");
                const prevBtn = carousel.querySelector(".carousel-prev");
                const nextBtn = carousel.querySelector(".carousel-next");
                const dots = carousel.querySelectorAll(".carousel-dot");
                if (!slidesContainer) return;
                const totalSlides = slidesContainer.children.length;
                let currentIndex = 0;
                const goToSlide = (index) => {
                    currentIndex = (index + totalSlides) % totalSlides;
                    slidesContainer.style.transform = `translateX(-${currentIndex * 100}%)`;
                    dots.forEach((dot, idx) => dot.classList.toggle("on", idx === currentIndex));
                    Array.from(slidesContainer.children).forEach((slide, idx) => {
                        const video = slide.querySelector("video");
                        if (video && idx !== currentIndex) video.pause();
                    });
                };
                if (prevBtn) prevBtn.addEventListener("click", () => goToSlide(currentIndex - 1));
                if (nextBtn) nextBtn.addEventListener("click", () => goToSlide(currentIndex + 1));
                dots.forEach((dot) => {
                    dot.addEventListener("click", () => {
                        const slideIndex = parseInt(dot.getAttribute("data-slide-to"), 10);
                        if (!Number.isNaN(slideIndex)) goToSlide(slideIndex);
                    });
                });
            });
        });
    </script>
</body>
</html>
